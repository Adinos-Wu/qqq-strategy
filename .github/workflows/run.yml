
name: QQQ Strategy Auto Check

on:
  schedule:
    - cron: '17 22 * * 1-5'

  workflow_dispatch:

# 允许 GitHub Actions 更新仓库文件
permissions:
  contents: write

# 避免多个任务同时运行、同时修改交易日期记录
concurrency:
  group: qqq-strategy
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. 获取仓库代码
      # =========================

      - name: Checkout code
        uses: actions/checkout@v4

      # =========================
      # 2. 设置 Python
      # =========================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # =========================
      # 3. 安装依赖
      # =========================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # 4. 运行策略
      # =========================

      - name: Run Strategy Script
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python main.py

      # =========================
      # 5. 保存交易日期记录
      # =========================

      - name: Save Trade Date
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last_trade_date.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update QQQ last trade date"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "交易日期记录已成功保存。"
          else
            echo "交易日期记录没有变化，无需提交。"
          fi
